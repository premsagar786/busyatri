kind = "mobile"
previewPath = "/campus-bus-tracker/"
title = "Campus Bus Tracker"
description = "A college transport app where students can see live bus locations and campus parking remarks, drivers share their phone GPS while on duty, and admins manage buses and drivers."
version = "1.0.0"
id = "artifacts/campus-bus-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/campus-bus-tracker/" ]
localPort = 20067

[services.development]
run = "pnpm --filter @workspace/campus-bus-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-bus-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/campus-bus-tracker", "run", "serve" ]

[services.env]
PORT = "20067"
BASE_PATH = "/campus-bus-tracker/"
